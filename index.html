<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Nghe Truyện & Nhạc Nền</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Audio Web</h1>
        
        <div class="main-grid">
            <!-- Khu vực 1: Trình phát truyện MP3 -->
            <section class="card">
                <h2>1. Truyện Audio</h2>
                <div class="upload-box">
                    <label for="audio-upload" class="custom-file-upload">
                        + Chọn file truyện (.mp3)
                    </label>
                    <input type="file" id="audio-upload" accept="audio/*" multiple>
                </div>

                <div class="player-controls">
                    <p id="current-story-title">Chưa chọn truyện nào</p>
                    <audio id="story-player" controls></audio>
                    
                    <div class="speed-control">
                        <label for="playback-speed">Tốc Độ:</label>
                        <select id="playback-speed">
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1.0x (Chuẩn)</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                        </select>
                    </div>
                </div>

                <ul id="playlist" class="playlist"></ul>
            </section>

            <!-- Khu vực 2: Nhạc nền YouTube -->
            <section class="card">
                <h2>2. Chọn Nhạc</h2>
                <div class="yt-input-group">
                    <input type="text" id="yt-url" placeholder="Dán link YouTube vào đây...">
                    <button id="load-yt-btn">Phát nhạc</button>
                </div>

                <div class="video-wrapper">
                    <div id="youtube-player"></div>
                </div>

                <div class="volume-control">
                    <label for="yt-volume">Âm Lượng: <span id="vol-value">30</span>%</label>
                    <input type="range" id="yt-volume" min="0" max="100" value="30">
                </div>
            </section>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
